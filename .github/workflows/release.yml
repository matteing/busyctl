name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release macOS binaries
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: |
          go test ./...
          go vet ./...

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

      - name: Build macOS archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"

          for arch in arm64 amd64; do
            package="busyctl_${version}_darwin_${arch}"
            package_dir="dist/${package}"
            mkdir -p "${package_dir}"

            CGO_ENABLED=0 GOOS=darwin GOARCH="${arch}" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${version}" \
              -o "${package_dir}/busyctl" \
              ./cmd/busyctl

            cp README.md LICENSE "${package_dir}/"
            tar -C dist -czf "dist/${package}.tar.gz" "${package}"
            rm -rf "${package_dir}"
          done

          cd dist
          shasum -a 256 ./*.tar.gz > checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz \
            dist/checksums.txt \
            --verify-tag \
            --generate-notes \
            --title "busyctl ${GITHUB_REF_NAME}"
