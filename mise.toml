[tools]
go = "1.26.5"

[tasks.build]
description = "Build the Apple Music display"
run = "go build -o bin/applemusic ./cmd/applemusic"

[tasks.test]
description = "Run the test suite"
run = "go test ./..."

[tasks.check]
description = "Run tests and static analysis"
run = ["go test ./...", "go vet ./..."]
