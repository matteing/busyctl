[tools]
go = "1.26.5"

[tasks.build]
description = "Build busyctl"
run = ["mkdir -p bin", "go build -trimpath -o bin/busyctl ./cmd/busyctl"]

[tasks.test]
description = "Run the test suite"
run = "go test ./..."

[tasks.check]
description = "Run tests and static analysis"
run = ["go test ./...", "go vet ./..."]
